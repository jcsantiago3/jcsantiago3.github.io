---
layout: default
title: Blog
permalink: /blog/
---

<h1>Blog</h1>

{% for post in site.posts %}

<article class="blog-post-preview">

    <h2>
        <a href="{{ post.url | relative_url }}">
            {{ post.title }}
        </a>
    </h2>

    <p>
        <em>{{ post.date | date: "%B %-d, %Y" }}</em>
    </p>

    <div>
        {{ post.excerpt }}
    </div>

</article>

{% endfor %}
