---
layout: default
title: Blog
permalink: /writing/
---

<h1>Writing</h1>
<table class="writing-table">
  {% for post in site.posts %}
  <tr>
    <td>{{ post.date | date: "%Y - %m - %d" }}</td>
    <td>
      <a href="{{ post.url | relative_url }}"> {{ post.title }} </a>
    </td>
    <td>{{ post.excerpt }}</td>
  </tr>
  {% endfor %}
</table>
