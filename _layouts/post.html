---
layout: default
---

<article class="blog-post">

    <header class="blog-post-header">
        <h1>{{ page.title }}</h1>

        <p>
            <em>{{ page.date | date: "%B %-d, %Y" }}</em>
        </p>
    </header>

    <div class="blog-post-content">
        {{ content }}
    </div>

</article>
